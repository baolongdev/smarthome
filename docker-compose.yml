services:
  smarthome:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: smarthome
    restart: unless-stopped
    env_file:
      - .env.production
    ports:
      - "3000:3000"
    init: true
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health/mongodb').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
